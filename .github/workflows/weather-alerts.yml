name: Weather alerts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-alert-state
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MUNICIPIO_ID: ${{ vars.MUNICIPIO_ID }}
      MUNICIPIO_NOMBRE: ${{ vars.MUNICIPIO_NOMBRE }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
      RAIN_PROB_THRESHOLD: ${{ vars.RAIN_PROB_THRESHOLD || '70' }}
      WIND_KMH_THRESHOLD: ${{ vars.WIND_KMH_THRESHOLD || '45' }}
      HEAT_TEMP_THRESHOLD: ${{ vars.HEAT_TEMP_THRESHOLD || '35' }}
      COLD_TEMP_THRESHOLD: ${{ vars.COLD_TEMP_THRESHOLD || '0' }}
      AEMET_ALERT_AREA: ${{ vars.AEMET_ALERT_AREA || '72' }}
      AEMET_STATION_ID: ${{ vars.AEMET_STATION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore notification state
        shell: bash
        run: |
          mkdir -p .state
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state --depth=1
            git show origin/bot-state:notified_alerts.json > .state/notified_alerts.json || echo "{}" > .state/notified_alerts.json
          else
            echo "{}" > .state/notified_alerts.json
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        run: python -m src.main alerts

      - name: Persist notification state
        shell: bash
        run: |
          if [ ! -f .state/notified_alerts.json ]; then
            echo "{}" > .state/notified_alerts.json
          fi

          state_dir="$(mktemp -d)"
          cp .state/notified_alerts.json "$state_dir/notified_alerts.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state --depth=1
            git switch --detach origin/bot-state
          else
            git switch --orphan bot-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$state_dir/notified_alerts.json" notified_alerts.json
          git add notified_alerts.json
          git commit -m "Update notification state" || exit 0
          git push origin HEAD:bot-state
