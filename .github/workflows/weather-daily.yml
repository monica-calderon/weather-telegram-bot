name: Weather daily summary

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-daily-summary
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      NTFY_METHOD: ${{ vars.NTFY_METHOD || secrets.NTFY_METHOD || 'auto' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_USERNAME: ${{ secrets.NTFY_USERNAME }}
      NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
      NTFY_PRIORITY: ${{ vars.NTFY_PRIORITY }}
      NTFY_TAGS: ${{ vars.NTFY_TAGS }}
      MUNICIPIO_ID: ${{ vars.MUNICIPIO_ID }}
      MUNICIPIO_NOMBRE: ${{ vars.MUNICIPIO_NOMBRE }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
      RAIN_PROB_THRESHOLD: ${{ vars.RAIN_PROB_THRESHOLD || '50' }}
      WIND_KMH_THRESHOLD: ${{ vars.WIND_KMH_THRESHOLD || '45' }}
      HEAT_TEMP_THRESHOLD: ${{ vars.HEAT_TEMP_THRESHOLD || '35' }}
      COLD_TEMP_THRESHOLD: ${{ vars.COLD_TEMP_THRESHOLD || '0' }}
      AEMET_ALERT_AREA: ${{ vars.AEMET_ALERT_AREA || '72' }}
      AEMET_STATION_ID: ${{ vars.AEMET_STATION_ID }}
      CURRENT_OBSERVATION_MAX_AGE_MINUTES: ${{ vars.CURRENT_OBSERVATION_MAX_AGE_MINUTES || '150' }}
      OPEN_METEO_LATITUDE: ${{ vars.OPEN_METEO_LATITUDE }}
      OPEN_METEO_LONGITUDE: ${{ vars.OPEN_METEO_LONGITUDE }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_IDS: ${{ vars.GOOGLE_CALENDAR_IDS || secrets.GOOGLE_CALENDAR_IDS }}
      GOOGLE_CALENDAR_NAMES: ${{ vars.GOOGLE_CALENDAR_NAMES || secrets.GOOGLE_CALENDAR_NAMES }}
      CALENDAR_EVENTS_MAX: ${{ vars.CALENDAR_EVENTS_MAX || secrets.CALENDAR_EVENTS_MAX || '10' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Restore AEMET cache
        shell: bash
        run: |
          mkdir -p .state
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state --depth=1
            git show origin/bot-state:aemet_cache.json > .state/aemet_cache.json || echo "{}" > .state/aemet_cache.json
          else
            echo "{}" > .state/aemet_cache.json
          fi

      - name: Install dependencies
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Send daily summary
        run: python -m src.main daily

      - name: Persist AEMET cache
        if: always()
        shell: bash
        run: |
          if [ ! -f .state/aemet_cache.json ]; then
            echo "{}" > .state/aemet_cache.json
          fi

          state_dir="$(mktemp -d)"
          cp .state/aemet_cache.json "$state_dir/aemet_cache.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state --depth=1
            git switch --detach origin/bot-state
          else
            git switch --orphan bot-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$state_dir/aemet_cache.json" aemet_cache.json
          git add aemet_cache.json
          git commit -m "Update AEMET cache" || exit 0
          git push origin HEAD:bot-state
